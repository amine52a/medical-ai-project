<header class="main_menu home_menu">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-12">
        <nav class="navbar navbar-expand-lg navbar-light">
          <a class="navbar-brand" href="#">
            <img [src]="logoPath" alt="logo">
          </a>
          <button class="navbar-toggler" type="button" (click)="toggleMenu()">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse main-menu-item justify-content-center" [class.show]="!isMenuCollapsed">
            <ul class="navbar-nav align-items-center">
              <li class="nav-item" [class.active]="activeLink === 'home'">
                <a class="nav-link" href="#" (click)="setActive('home')">Home</a>
              </li>
              <li class="nav-item" [class.active]="activeLink === 'about'">
                <a class="nav-link" href="/about" (click)="setActive('about')">About</a>
              </li>
              <li class="nav-item" [class.active]="activeLink === 'doctors'">
                <a class="nav-link" href="/Call" (click)="setActive('doctors')">Book a call</a>
              </li>
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown">
                  IA Modules
                </a>
                <div class="dropdown-menu">
                  <a class="dropdown-item" href="/symptom-checker">Symptom Checker</a>
                  <a class="dropdown-item" href="/Voice-chat">IA-Friend</a>
                </div>
              </li>
              <li class="nav-item" [class.active]="activeLink === 'contact'">
                <a class="nav-link" href="/Contact" (click)="setActive('contact')">Contact</a>
              </li>
               <li class="nav-item">
                <a class="nav-link" href="/Profile">Profile</a>
              </li>
            </ul>
          </div>
          <a class="btn_2 d-none d-lg-block" href="tel:09856">HOT LINE- 09856</a>
        </nav>
      </div>
    </div>
  </div>
</header>
