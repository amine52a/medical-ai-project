name: Build and deploy Python app to Azure Web App - medical-django-backend

on:
  push:
    branches:
      - backend
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and activate virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: |
          cd medical-ai-backend
          pip install -r requirements.txt

      - name: Prepare artifact
        run: |
          cd medical-ai-backend
          zip -r ../artifact.zip .  # zip all contents of subfolder into a flat zip

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: artifact.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_86CFB24666EF4DBABA1E66983240CF53 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_941AD0E0D4CB47AA95AE5DB62E8BBDD2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_95F8D19C92D4466B9E0DAA6C23DD875F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'medical-django-backend'
          package: 'artifact.zip'
